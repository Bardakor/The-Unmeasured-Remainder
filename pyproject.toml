[project]
name = "footy"
version = "0.1.0"
description = "Reproducible study of how much of \"who was the best footballer of 2020-2026\" public match data can decide"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "football",
    "player-ratings",
    "plus-minus",
    "multiverse-analysis",
    "research-reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0", "scipy>=1.14", "pandas>=2.2", "matplotlib>=3.9"]

[project.urls]
Homepage = "https://github.com/Bardakor/The-Unmeasured-Remainder"
Repository = "https://github.com/Bardakor/The-Unmeasured-Remainder"
Documentation = "https://github.com/Bardakor/The-Unmeasured-Remainder/blob/main/paper-unmeasured/preregistration.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "pandas-stubs>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footy"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
